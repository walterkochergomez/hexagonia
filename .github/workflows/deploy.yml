name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - run: npm run sim
        env:
          SIM_GAMES: '1'
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Si en Settings → Pages quedó «Deploy from a branch», GitHub publica además el código sin
      # compilar. Se espera a que esa publicación termine para que la versión compilada quede encima.
      - name: Esperar la publicación automática de GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            pending=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=20" \
              --jq '[.workflow_runs[] | select(.event == "dynamic" and .status != "completed")] | length' || echo 0)
            if [ "$pending" = "0" ]; then break; fi
            echo "Esperando a «pages build and deployment»…"
            sleep 5
          done
      - id: deployment
        uses: actions/deploy-pages@v5
